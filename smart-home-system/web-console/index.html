<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="栖居全屋智能中控台 - 家具状态、手动控制与智能助手视觉 Demo"
    />
    <title>栖居 · 全屋智能中控</title>
    <link rel="stylesheet" href="./styles.css?v=20260622-scroll-fix" />
  </head>
  <body>
    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="icon-home" viewBox="0 0 24 24">
        <path d="M3 10.8 12 3l9 7.8v8.7a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5v-8.7Z" />
        <path d="M9 21v-7h6v7" />
      </symbol>
      <symbol id="icon-grid" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="2" />
        <rect x="14" y="3" width="7" height="7" rx="2" />
        <rect x="3" y="14" width="7" height="7" rx="2" />
        <rect x="14" y="14" width="7" height="7" rx="2" />
      </symbol>
      <symbol id="icon-sparkles" viewBox="0 0 24 24">
        <path d="m12 3 1.4 4.1L17.5 8.5l-4.1 1.4L12 14l-1.4-4.1-4.1-1.4 4.1-1.4L12 3Z" />
        <path d="m18.5 14 1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1 1-2.5Z" />
        <path d="m5 14 .8 2.2L8 17l-2.2.8L5 20l-.8-2.2L2 17l2.2-.8L5 14Z" />
      </symbol>
      <symbol id="icon-chart" viewBox="0 0 24 24">
        <path d="M4 20V10m6 10V4m6 16v-7m4 7V7" />
      </symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z" />
      </symbol>
      <symbol id="icon-ac" viewBox="0 0 32 32">
        <rect x="3.5" y="7" width="25" height="13" rx="4" />
        <path d="M7.5 15.5h17M10 20v2.5c0 1.7-1.3 3-3 3m10-5.5v3.5c0 2-1.5 3.5-3.5 3.5M24 20v2c0 1.5 1 2.5 2.5 2.5" />
        <path d="M23.5 11.5h.1" />
      </symbol>
      <symbol id="icon-light" viewBox="0 0 32 32">
        <path d="M16 3a9 9 0 0 0-5.4 16.2c1 .8 1.7 1.7 1.9 2.8h7c.2-1.1.9-2 1.9-2.8A9 9 0 0 0 16 3Z" />
        <path d="M12.5 25h7M14 28h4M16 7v2M8.5 10l1.5 1M23.5 10 22 11" />
      </symbol>
      <symbol id="icon-tv" viewBox="0 0 32 32">
        <rect x="3" y="6" width="26" height="18" rx="3.5" />
        <path d="m12 29 4-5 4 5M11 29h10M14 12l6 3.5-6 3.5v-7Z" />
      </symbol>
      <symbol id="icon-fridge" viewBox="0 0 32 32">
        <rect x="8" y="2.5" width="16" height="27" rx="3" />
        <path d="M8 14h16M12 8v3M12 18v4" />
      </symbol>
      <symbol id="icon-fan" viewBox="0 0 32 32">
        <circle cx="16" cy="14" r="3" />
        <path d="M16 11c-1-5.5.2-8 2.5-8 3 0 5 4.7.5 9.8M18.6 15.5c5.2 2 6.7 4.3 5.5 6.3-1.5 2.6-6.6 1.9-8.2-3.2M13.4 15.5c-4.3 3.5-7 3.7-8.1 1.7-1.5-2.6 1.6-6.7 6-5.2" />
        <path d="M16 17v11M11 29h10" />
      </symbol>
      <symbol id="icon-mic" viewBox="0 0 24 24">
        <rect x="8" y="2" width="8" height="13" rx="4" />
        <path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8" />
      </symbol>
      <symbol id="icon-send" viewBox="0 0 24 24">
        <path d="m3 11 18-8-8 18-2-8-8-2Z" />
        <path d="m11 13 4-4" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="m6 6 12 12M18 6 6 18" />
      </symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24">
        <path d="m9 18 6-6-6-6" />
      </symbol>
      <symbol id="icon-leaf" viewBox="0 0 24 24">
        <path d="M20.5 3.5C12 3.5 5 7 5 13a6 6 0 0 0 6 6c6 0 9.5-7 9.5-15.5Z" />
        <path d="M4 21c2-5 6-8 11-11" />
      </symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24">
        <path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z" />
      </symbol>
      <symbol id="icon-shield" viewBox="0 0 24 24">
        <path d="M12 3 4.5 6v5.5c0 4.7 3.2 8.2 7.5 9.5 4.3-1.3 7.5-4.8 7.5-9.5V6L12 3Z" />
        <path d="m9 12 2 2 4-4" />
      </symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" aria-label="栖居首页">
          <span class="brand-mark"><span></span><span></span><span></span></span>
        </a>
        <nav class="main-nav" aria-label="主导航">
          <button class="nav-item active" type="button" data-tooltip="总览" aria-label="总览">
            <svg><use href="#icon-grid"></use></svg>
          </button>
          <button class="nav-item" type="button" data-tooltip="场景" aria-label="场景">
            <svg><use href="#icon-sparkles"></use></svg>
          </button>
          <button class="nav-item" type="button" data-tooltip="能耗" aria-label="能耗">
            <svg><use href="#icon-chart"></use></svg>
          </button>
        </nav>
        <div class="sidebar-bottom">
          <button class="nav-item" type="button" data-tooltip="设置" aria-label="设置">
            <svg><use href="#icon-settings"></use></svg>
          </button>
          <button class="avatar-button" type="button" aria-label="个人资料">XJ</button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p class="eyebrow">MY HOME · 上海</p>
            <h1>早上好，欢迎回家</h1>
          </div>
          <div class="topbar-actions">
            <div class="weather-pill">
              <svg><use href="#icon-sun"></use></svg>
              <div>
                <strong>26°</strong>
                <span>晴朗 · 空气优</span>
              </div>
            </div>
            <button class="security-pill" type="button" id="securityButton">
              <span class="status-dot"></span>
              <span>全屋在线</span>
              <svg><use href="#icon-shield"></use></svg>
            </button>
          </div>
        </header>

        <section class="overview-grid">
          <article class="welcome-card">
            <div class="welcome-copy">
              <span class="welcome-label">
                <svg><use href="#icon-sparkles"></use></svg>
                栖居智能助手
              </span>
              <h2>舒适，恰到好处。</h2>
              <p>三台课程演示设备已接入后端。试试说“打开客厅灯”，剩下的交给我。</p>
              <button class="text-button" id="openAssistantButton" type="button">
                开始对话
                <svg><use href="#icon-chevron"></use></svg>
              </button>
            </div>
            <div class="ambient-visual" aria-hidden="true">
              <div class="orb orb-large">
                <span class="temperature">24<sup>°</sup></span>
                <small>室内温度</small>
              </div>
              <div class="orb orb-small orb-humidity">
                <strong>52%</strong>
                <small>湿度</small>
              </div>
              <div class="orb orb-tiny"></div>
            </div>
          </article>

          <article class="energy-card">
            <div class="card-heading">
              <div>
                <span class="section-kicker">今日用电</span>
                <h3>4.8 <small>kWh</small></h3>
              </div>
              <span class="trend-badge">↓ 12%</span>
            </div>
            <div class="energy-chart" aria-label="今日分时用电趋势图">
              <div class="chart-line">
                <svg viewBox="0 0 320 108" preserveAspectRatio="none" aria-hidden="true">
                  <defs>
                    <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stop-color="#b8e8d2" stop-opacity=".55" />
                      <stop offset="100%" stop-color="#b8e8d2" stop-opacity="0" />
                    </linearGradient>
                  </defs>
                  <path class="chart-area" d="M0 88 C38 80 45 46 79 55 S126 83 160 61 S208 18 242 43 S282 75 320 29 L320 108 L0 108Z" />
                  <path class="chart-stroke" d="M0 88 C38 80 45 46 79 55 S126 83 160 61 S208 18 242 43 S282 75 320 29" />
                </svg>
                <span class="chart-point"></span>
              </div>
              <div class="chart-labels"><span>06:00</span><span>12:00</span><span>18:00</span><span>现在</span></div>
            </div>
            <div class="eco-note">
              <svg><use href="#icon-leaf"></use></svg>
              <span>本月已节省约 <strong>18.6 kWh</strong></span>
            </div>
          </article>
        </section>

        <section class="scene-section" aria-labelledby="sceneTitle">
          <div class="section-heading">
            <div>
              <span class="section-kicker">一键场景</span>
              <h2 id="sceneTitle">此刻，想要怎样的家？</h2>
            </div>
            <button class="more-button" type="button" id="moreScenesButton">管理场景</button>
          </div>
          <div class="scene-list">
            <button class="scene-chip" type="button" data-scene="home">
              <span class="scene-icon home-scene"><svg><use href="#icon-home"></use></svg></span>
              <span><strong>回家</strong><small>灯光与空调</small></span>
            </button>
            <button class="scene-chip" type="button" data-scene="movie">
              <span class="scene-icon movie-scene"><svg><use href="#icon-tv"></use></svg></span>
              <span><strong>观影</strong><small>氛围灯与电视</small></span>
            </button>
            <button class="scene-chip" type="button" data-scene="away">
              <span class="scene-icon away-scene"><svg><use href="#icon-shield"></use></svg></span>
              <span><strong>离家</strong><small>关闭非必要设备</small></span>
            </button>
          </div>
        </section>

        <section class="devices-section" aria-labelledby="devicesTitle">
          <div class="section-heading">
            <div>
              <span class="section-kicker">全部设备</span>
              <h2 id="devicesTitle">家的每一处，都在掌握</h2>
            </div>
            <div class="device-summary">
              <span><i class="summary-dot online"></i><strong id="onlineCount">0</strong> 在线</span>
              <span><i class="summary-dot active"></i><strong id="activeCount">0</strong> 运行中</span>
            </div>
          </div>
          <div class="device-grid" id="deviceGrid"></div>
        </section>

        <footer class="page-footer">
          <span>栖居 OS · 设备状态来自 backend-core</span>
          <span>Live API Mode</span>
        </footer>
      </main>
    </div>

    <div class="assistant-wrap" id="assistantWrap">
      <section class="chat-panel" id="chatPanel" aria-label="智能助手对话">
        <header class="chat-header">
          <div class="assistant-identity">
            <span class="assistant-avatar">
              <span></span><span></span><span></span>
            </span>
            <div>
              <strong>栖居</strong>
              <small><i></i> 随时为你服务</small>
            </div>
          </div>
          <button class="icon-button" id="closeChatButton" type="button" aria-label="收起对话">
            <svg><use href="#icon-close"></use></svg>
          </button>
        </header>
        <div class="messages" id="messages" aria-live="polite">
          <div class="message assistant-message">
            <span class="message-avatar">栖</span>
            <div>
              <p>早上好，我在这里。你可以让我控制家中的任意设备。</p>
              <time>现在</time>
            </div>
          </div>
        </div>
        <div class="suggestion-row" id="suggestionRow">
          <button type="button" data-command="打开客厅灯">打开客厅灯</button>
          <button type="button" data-command="空调调到 22 度">空调调到 22°</button>
          <button type="button" data-command="开启观影模式">开启观影模式</button>
        </div>
      </section>

      <form class="assistant-dock" id="assistantForm">
        <button class="voice-button" id="voiceButton" type="button" aria-label="按下开始语音">
          <svg><use href="#icon-mic"></use></svg>
          <span class="voice-pulse"></span>
        </button>
        <div class="assistant-input-area">
          <span class="assistant-status" id="assistantStatus">栖居智能助手</span>
          <input
            id="assistantInput"
            type="text"
            autocomplete="off"
            placeholder="输入指令，例如“把客厅灯调到 50%”"
            aria-label="向智能助手发送消息"
          />
          <div class="voice-feedback" id="voiceFeedback" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <button class="send-button" type="submit" aria-label="发送消息">
          <svg><use href="#icon-send"></use></svg>
        </button>
      </form>
    </div>

    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="device-drawer" id="deviceDrawer" aria-label="设备详情" aria-hidden="true">
      <div id="drawerContent"></div>
    </aside>

    <div class="toast-region" id="toastRegion" aria-live="polite"></div>

    <script src="./app.js?v=20260622-scroll-fix"></script>
  </body>
</html>
